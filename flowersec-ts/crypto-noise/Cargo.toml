[package]
name = "flowersec-noise-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Internal bounded Snow handshake adapter for Flowersec TypeScript"

[lib]
crate-type = ["cdylib"]

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-p256", "use-curve25519", "use-aes-gcm", "use-chacha20poly1305", "use-sha2", "risky-raw-split"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "zeroize"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = "=1.9.0"
getrandom = { version = "=0.2.17", features = ["custom"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
