[package]
name = "flowersec-rust-client-example"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
flowersec = { version = "=7.0.0", path = "../../flowersec-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
