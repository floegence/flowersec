[package]
name = "flowersec-rust-client-example"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
bytes = "1"
flowersec = { version = "=3.2.1", path = "../../flowersec-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
