[package]
name = "flowersec-node-native"
version = "6.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
flowersec-native-transport = { path = "../flowersec-native-transport", version = "=6.0.0" }
napi = { version = "=3.12.2", features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.11"
libsqlite3-sys = { version = "=0.38.2", features = ["loadable_extension"] }

[build-dependencies]
napi-build = "=2.4.1"
