[package]
name = "flowersec-node-native"
version = "7.2.1"
edition = "2024"
rust-version = "1.88"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
flowersec-native-transport = { path = "../flowersec-native-transport", version = "=7.2.1" }
napi = { version = "=3.16.2", features = ["napi8", "tokio_rt"] }
napi-derive = "=3.7.1"

[build-dependencies]
napi-build = "=2.6.0"
