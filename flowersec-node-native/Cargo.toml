[package]
name = "flowersec-node-native"
version = "5.0.1"
edition = "2024"
rust-version = "1.88"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
flowersec-native-transport = { path = "../flowersec-native-transport", version = "=5.0.1" }
napi = { version = "=3.12.2", features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.3"

[build-dependencies]
napi-build = "=2.4.1"
