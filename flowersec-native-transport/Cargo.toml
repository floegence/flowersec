[package]
name = "flowersec-native-transport"
version = "6.0.0"
edition = "2024"
rust-version = "1.88"
description = "Flowersec-owned native transport primitives shared by Rust and Node runtimes"
license = "MIT"
repository = "https://github.com/floegence/flowersec"
homepage = "https://github.com/floegence/flowersec"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "Cargo.toml"]

[features]
default = []
__flowersec_internal_test_support = []

[dependencies]
qpack = "=0.1.0"
url = "=2.5.4"
bytes = "1"
# The fixed native provider is private source so published builds retain the
# negotiated reliable-reset implementation.
udp = { package = "quinn-udp", version = "=0.5.15", default-features = false }
rand = "=0.9.3"
ring = "=0.17.14"
rustc-hash = "=2.1.3"
lru-slab = "=0.1.2"
slab = "=0.4.12"
tinyvec = { version = "=1.13.3", features = ["alloc"] }
tracing = { version = "=0.1.44", features = ["std"] }
pin-project-lite = "=0.2.17"
socket2 = "=0.6.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
x509-parser = "0.18"

[dev-dependencies]
time = "0.3"

assert_matches = "1.5"
hex-literal = "1"
rand_pcg = "=0.9.0"
tracing-futures = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"
lazy_static = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(wasm_browser)"] }
