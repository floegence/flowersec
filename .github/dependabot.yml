version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action

  - package-ecosystem: npm
    directory: /flowersec-ts
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /flowersec-go
    schedule:
      interval: weekly
    groups:
      quic-stack:
        patterns:
          - github.com/quic-go/quic-go
          - github.com/quic-go/webtransport-go

  - package-ecosystem: gomod
    directory: /tools/releasenotes
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tools/stabilitycheck
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-rust
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-native-transport
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-node-native
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-rust/fuzz
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /examples/rust
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /examples/swift
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
