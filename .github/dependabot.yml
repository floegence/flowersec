version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action

  - package-ecosystem: npm
    directory: /flowersec-ts
    schedule:
      interval: weekly
    ignore:
      # Flowersec v2 freezes IDNA behavior to Unicode 15.1; tr46 6 uses newer data.
      - dependency-name: tr46
        versions:
          - ">= 6.0.0"

  - package-ecosystem: gomod
    directory: /flowersec-go
    schedule:
      interval: weekly
    groups:
      quic-stack:
        patterns:
          - github.com/quic-go/quic-go
          - github.com/quic-go/webtransport-go

  - package-ecosystem: gomod
    directory: /tools/releasenotes
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tools/stabilitycheck
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-rust
    schedule:
      interval: weekly
    ignore:
      # Flowersec v2 freezes IDNA behavior to Unicode 15.1; 1.1.0 moves to Unicode 16.0.
      - dependency-name: idna_mapping
        versions:
          - ">= 1.1.0"
      # idna_adapter 1.2 uses newer ICU data that accepts post-15.1 code points.
      - dependency-name: idna_adapter
        versions:
          - ">= 1.2.0"

  - package-ecosystem: cargo
    directory: /flowersec-native-transport
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-node-native
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /flowersec-rust/fuzz
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /examples/rust
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /examples/swift
    schedule:
      interval: weekly
