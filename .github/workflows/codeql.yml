name: codeql

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  plan:
    name: Plan scheduled analysis
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      should_scan: ${{ steps.changes.outputs.should_scan }}
    steps:
      - name: Check for new main commits
        id: changes
        env:
          API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response=$(mktemp)
          trap 'rm -f -- "$response"' EXIT
          url="$API_URL/repos/$REPOSITORY/actions/workflows/codeql.yml/runs?branch=main&event=schedule&status=success&per_page=1"
          if ! curl --silent --show-error --fail-with-body --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "$url"; then
            echo "::warning::Could not inspect previous CodeQL runs; scanning fail-safe."
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha=$(jq -r '.workflow_runs[0].head_sha // ""' "$response")
          if [[ -n "$previous_sha" && "$previous_sha" == "$HEAD_SHA" ]]; then
            echo "No new main commit since the latest successful scheduled CodeQL run."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    if: needs.plan.outputs.should_scan == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: c-cpp
            build-mode: none
            runner: ubuntu-latest
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: ruby
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Swift build cache
        if: matrix.language == 'swift'
        run: |
          swift package --skip-update --only-use-versions-from-resolved-file resolve
          swift build --skip-update --only-use-versions-from-resolved-file --target Flowersec

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Swift library
        if: matrix.language == 'swift'
        run: |
          find flowersec-swift/Sources/Flowersec -type f -name '*.swift' -exec touch {} +
          swift build --skip-update --only-use-versions-from-resolved-file --target Flowersec

      - name: Autobuild Go
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
