name: rust-release-recovery

on:
  workflow_call:
    inputs:
      version:
        description: "Rust crate version to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Rust crate version to recover"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Checkout release commit
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION_INPUT"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be canonical major.minor.patch" >&2
            exit 2
          fi
          git fetch --force origin "refs/tags/flowersec-rust/v${VERSION}:refs/tags/flowersec-rust/v${VERSION}"
          git checkout --detach "refs/tags/flowersec-rust/v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit is the remote main tip
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          local_main_sha="$(git rev-parse refs/remotes/origin/main)"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          if [[ "$release_sha" != "$local_main_sha" || "$release_sha" != "$remote_main_sha" ]]; then
            echo "release tag must point at the current remote main tip" >&2
            echo "tag=$release_sha local_main=$local_main_sha remote_main=$remote_main_sha" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate release version facts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/check-release-version-consistency.mjs "$RELEASE_VERSION"

      - name: Verify release tags
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/verify-release-tags.sh "$RELEASE_VERSION" "$(git rev-parse HEAD)"

      - name: Check whether native transport version is already published
        id: native-published
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://crates.io/api/v1/crates/flowersec-native-transport/${RELEASE_VERSION}"
          STATUS="$(curl --silent --show-error --location \
            --user-agent "flowersec-release-recovery/${RELEASE_VERSION} (https://github.com/floegence/flowersec)" \
            --output /dev/null --write-out '%{http_code}' "$URL")"
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response status: $STATUS" >&2; exit 1 ;;
          esac

      - name: Authenticate native transport publication
        if: steps.native-published.outputs.exists != 'true'
        id: native-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish native transport crate
        if: steps.native-published.outputs.exists != 'true'
        working-directory: flowersec-native-transport
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.native-auth.outputs.token }}
        run: cargo publish --no-verify

      - name: Wait for native transport registry readback
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-crates-release-package.mjs flowersec-native-transport "$RELEASE_VERSION" "$(git rev-parse HEAD)"
          node scripts/verify-crates-release-consumer.mjs flowersec-native-transport "$RELEASE_VERSION"

      - name: Check whether Flowersec Rust SDK version is already published
        id: sdk-published
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://crates.io/api/v1/crates/flowersec/${RELEASE_VERSION}"
          STATUS="$(curl --silent --show-error --location \
            --user-agent "flowersec-release-recovery/${RELEASE_VERSION} (https://github.com/floegence/flowersec)" \
            --output /dev/null --write-out '%{http_code}' "$URL")"
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response status: $STATUS" >&2; exit 1 ;;
          esac

      - name: Authenticate Flowersec Rust SDK publication
        if: steps.sdk-published.outputs.exists != 'true'
        id: sdk-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish Flowersec Rust SDK
        if: steps.sdk-published.outputs.exists != 'true'
        working-directory: flowersec-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.sdk-auth.outputs.token }}
        run: cargo publish --no-verify

      - name: Verify Flowersec Rust SDK registry readback
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-crates-release-package.mjs flowersec "$RELEASE_VERSION" "$(git rev-parse HEAD)"
          node scripts/verify-crates-release-consumer.mjs flowersec "$RELEASE_VERSION"
