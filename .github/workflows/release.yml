name: release

on:
  push:
    tags:
      - "flowersec-go/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing coordinated release version to recover"
        required: true
        type: string
      mode:
        description: "Recovery scope"
        required: true
        default: npm-only
        type: choice
        options:
          - full
          - npm-only

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: flowersec-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}
      release_exists: ${{ steps.release-state.outputs.exists }}
      release_complete: ${{ steps.release-state.outputs.complete }}
    steps:
      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_MODE_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION_INPUT"
          if [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF_NAME#flowersec-go/v}"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be canonical major.minor.patch" >&2
            exit 2
          fi
          MODE="${RELEASE_MODE_INPUT:-full}"
          if [[ "$MODE" != "full" && "$MODE" != "npm-only" ]]; then
            echo "mode must be full or npm-only" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Inspect immutable GitHub Release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.version.outputs.mode }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="flowersec-go/v${RELEASE_VERSION}"
          error_file="$(mktemp)"
          assets_file="$(mktemp)"
          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          downloaded_file="$(mktemp)"
          readback_dir="$(mktemp -d)"
          cleanup() {
            unlink "$error_file" "$assets_file" "$expected_file" "$actual_file" "$downloaded_file" 2>/dev/null || true
            rm -rf "$readback_dir"
          }
          trap cleanup EXIT
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | [.name, (.size // 0), (.state // "")] | @tsv' \
            >"$assets_file" 2>"$error_file"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            expected_assets=(
              checksums.txt
              checksums.txt.sig
              checksums.txt.pem
              "floegence-flowersec-core-${RELEASE_VERSION}.tgz"
              "floegence-flowersec-core-${RELEASE_VERSION}.tgz.sig"
              "floegence-flowersec-core-${RELEASE_VERSION}.tgz.pem"
              "floegence-flowersec-node-native-${RELEASE_VERSION}.tgz"
              "floegence-flowersec-node-native-${RELEASE_VERSION}.tgz.sig"
              "floegence-flowersec-node-native-${RELEASE_VERSION}.tgz.pem"
              "flowersec-runtime_${RELEASE_VERSION}_linux_amd64.tar.gz"
              "flowersec-runtime_${RELEASE_VERSION}_linux_amd64.tar.gz.sig"
              "flowersec-runtime_${RELEASE_VERSION}_linux_amd64.tar.gz.pem"
              "flowersec-runtime_${RELEASE_VERSION}_linux_arm64.tar.gz"
              "flowersec-runtime_${RELEASE_VERSION}_linux_arm64.tar.gz.sig"
              "flowersec-runtime_${RELEASE_VERSION}_linux_arm64.tar.gz.pem"
            )
            for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
              archive="floegence-flowersec-node-native-${platform}-${RELEASE_VERSION}.tgz"
              expected_assets+=("$archive" "$archive.sig" "$archive.pem")
            done
            printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort >"$expected_file"
            : >"$actual_file"
            while IFS=$'\t' read -r name size state; do
              [[ -n "$name" && "$size" =~ ^[1-9][0-9]*$ && "$state" == uploaded ]] || {
                echo "existing GitHub Release has an invalid, empty, or incomplete asset" >&2
                exit 1
              }
              grep -Fqx "$name" "$expected_file" || {
                echo "existing GitHub Release contains an unexpected asset: $name" >&2
                exit 1
              }
              printf '%s\n' "$name" >>"$actual_file"
            done <"$assets_file"
            LC_ALL=C sort "$actual_file" -o "$actual_file"
            duplicate="$(uniq -d "$actual_file" | head -n 1)"
            [[ -z "$duplicate" ]] || {
              echo "existing GitHub Release contains a duplicate asset: $duplicate" >&2
              exit 1
            }
            if [[ -s "$actual_file" ]]; then
              set +e
              timeout --kill-after=5s 120s gh release download "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern '*' \
                --dir "$readback_dir" 2>"$error_file"
              download_status=$?
              set -e
              if [[ $download_status -eq 124 || $download_status -eq 137 ]]; then
                echo "existing GitHub Release asset readback timed out after 120s (killed after 5s grace): $TAG" >&2
                exit 124
              fi
              if [[ $download_status -ne 0 ]]; then
                echo "existing GitHub Release asset readback failed with exit $download_status: $TAG" >&2
                sed -E 's/(token|authorization)[^ ]*/\1=<redacted>/Ig' "$error_file" >&2
                exit "$download_status"
              fi
            fi
            find "$readback_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort >"$downloaded_file"
            cmp -s "$actual_file" "$downloaded_file" || {
              echo "existing GitHub Release asset readback does not match API metadata" >&2
              exit 1
            }
            exists=true
            if cmp -s "$expected_file" "$actual_file"; then
              archives=(
                "floegence-flowersec-core-${RELEASE_VERSION}.tgz"
                "floegence-flowersec-node-native-${RELEASE_VERSION}.tgz"
                "floegence-flowersec-node-native-darwin-arm64-${RELEASE_VERSION}.tgz"
                "floegence-flowersec-node-native-darwin-x64-${RELEASE_VERSION}.tgz"
                "floegence-flowersec-node-native-linux-arm64-gnu-${RELEASE_VERSION}.tgz"
                "floegence-flowersec-node-native-linux-x64-gnu-${RELEASE_VERSION}.tgz"
                "flowersec-runtime_${RELEASE_VERSION}_linux_amd64.tar.gz"
                "flowersec-runtime_${RELEASE_VERSION}_linux_arm64.tar.gz"
              )
              content_valid=true
              command -v cosign >/dev/null
              for name in "${expected_assets[@]}"; do
                test -s "$readback_dir/$name" || content_valid=false
              done
              printf '%s\n' "${archives[@]}" | LC_ALL=C sort >"$expected_file"
              awk 'NF == 2 { print $2 }' "$readback_dir/checksums.txt" | LC_ALL=C sort >"$actual_file"
              cmp -s "$expected_file" "$actual_file" || content_valid=false
              ( cd "$readback_dir" && sha256sum --check checksums.txt ) || content_valid=false
              identities=(
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
              )
              for asset in checksums.txt "${archives[@]}"; do
                verified=false
                for identity in "${identities[@]}"; do
                  if cosign verify-blob \
                    --new-bundle-format=false \
                    --signature "$readback_dir/${asset}.sig" \
                    --certificate "$readback_dir/${asset}.pem" \
                    --certificate-identity "$identity" \
                    --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                    "$readback_dir/$asset" >/dev/null 2>&1; then
                    verified=true
                    break
                  fi
                done
                [[ "$verified" == true ]] || content_valid=false
              done
              if [[ "$content_valid" == true ]]; then
                complete=true
              else
                echo "existing GitHub Release failed content readback and will require full recovery" >&2
                complete=false
              fi
            else
              complete=false
            fi
          elif grep -Fq "HTTP 404" "$error_file"; then
            exists=false
            complete=false
          else
            sed -E 's/(token|authorization)[^ ]*/\1=<redacted>/Ig' "$error_file" >&2
            exit "$status"
          fi
          if [[ "$RELEASE_MODE" == "npm-only" && "$exists" != true ]]; then
            echo "npm-only recovery requires an existing immutable GitHub Release" >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" == "npm-only" && "$complete" != true ]]; then
            echo "npm-only recovery requires a complete immutable GitHub Release" >&2
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

  rust-publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release_lock_held: true

  native-prebuilt:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.release_complete == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/flowersec-go/v${{ needs.prepare.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      - name: Build native addon
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cargo build --manifest-path flowersec-node-native/Cargo.toml --locked --release --target "$NATIVE_TARGET"
          mkdir -p "native-package/$NATIVE_PLATFORM"
          case "$NATIVE_TARGET" in
            *apple*)
              source_binary="flowersec-node-native/target/$NATIVE_TARGET/release/libflowersec_node_native.dylib"
              ;;
            *)
              source_binary="flowersec-node-native/target/$NATIVE_TARGET/release/libflowersec_node_native.so"
              ;;
          esac
          test -f "$source_binary"
          cp "$source_binary" "native-package/$NATIVE_PLATFORM/flowersec-node-native.$NATIVE_PLATFORM.node"
          cp "flowersec-node-native/npm/$NATIVE_PLATFORM/package.json" "native-package/$NATIVE_PLATFORM/package.json"

      - name: Upload native prebuilt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowersec-node-native-${{ matrix.platform }}
          path: native-package/${{ matrix.platform }}
          if-no-files-found: error

  release:
    needs: [prepare, rust-publish, native-prebuilt]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.mode == 'full' &&
      needs.rust-publish.result == 'success' &&
      ((needs.prepare.outputs.release_complete == 'false' && needs.native-prebuilt.result == 'success') ||
      (needs.prepare.outputs.release_complete == 'true' && needs.native-prebuilt.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/flowersec-go/v${{ needs.prepare.outputs.version }}

      - name: Compute version vars
        id: vars
        env:
          RELEASE_VERSION_INPUT: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION_INPUT"
          TAG="flowersec-go/v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          DATE="$(git show -s --format='%cI' HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit is the remote main tip
        env:
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          local_main_sha="$(git rev-parse refs/remotes/origin/main)"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          if [[ "$RELEASE_SHA" != "$local_main_sha" || "$RELEASE_SHA" != "$remote_main_sha" ]]; then
            echo "release tag must point at the current remote main tip" >&2
            echo "tag=$RELEASE_SHA local_main=$local_main_sha remote_main=$remote_main_sha" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flowersec-go/go.mod
          cache: true
          cache-dependency-path: flowersec-go/go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: flowersec-ts/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0

      - name: Validate release version facts
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: node scripts/check-release-version-consistency.mjs "$RELEASE_VERSION"

      - name: Verify all language tags point to this commit
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
        run: scripts/verify-release-tags.sh "$RELEASE_VERSION" "$RELEASE_SHA"

      - name: Download native prebuilt packages
        if: needs.prepare.outputs.release_complete == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flowersec-node-native-*
          path: native-prebuilt
          merge-multiple: false

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build release artifacts
        if: needs.prepare.outputs.release_complete == 'false'
        env:
          RELEASE_DATE: ${{ steps.vars.outputs.date }}
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          COMMIT="$RELEASE_SHA"
          DATE="$RELEASE_DATE"

          mkdir -p dist

          # Build and pack the TypeScript SDK artifact.
          ( cd flowersec-ts && \
            npm ci --ignore-scripts --no-audit --no-fund && \
            npm run build \
          )
          node scripts/stage-npm-release-metadata.mjs "$COMMIT"

          # Pack the TypeScript npm tarball for no-clone installs (from GitHub Releases).
          # This does not publish to npm; it only produces a .tgz artifact.
          ( cd flowersec-ts && \
            npm pack --silent && \
            mv "floegence-flowersec-core-${VERSION}.tgz" "../dist/" \
          )

          # Stage all platform binaries before packing or publishing any Node package.
          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            package_dir="native-prebuilt/flowersec-node-native-${platform}"
            test -f "$package_dir/flowersec-node-native.${platform}.node"
            cp "$package_dir/flowersec-node-native.${platform}.node" "flowersec-node-native/npm/${platform}/"
          done
          ( cd flowersec-node-native && npm pack --silent --pack-destination ../dist )
          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            ( cd "flowersec-node-native/npm/${platform}" && npm pack --silent --pack-destination ../../../dist )
          done

          build_runtime() {
            local os="$1"
            local arch="$2"
            local dir="flowersec-runtime_${VERSION}_${os}_${arch}"
            rm -rf "$dir"
            mkdir -p "$dir"

            ( cd flowersec-go && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=v${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
                -o "../$dir/flowersec-runtime" ./cmd/flowersec-runtime \
            )

            cp LICENSE "$dir/"
            scripts/stage-release-compliance.sh runtime "$dir"
            tar -C "$dir" -czf "dist/${dir}.tar.gz" .
          }

          build_runtime linux amd64
          build_runtime linux arm64

          ( cd dist && sha256sum *.tgz *.tar.gz > checksums.txt )

          # Every published release asset receives a keyless Sigstore signature
          # and certificate. Checksums remain a convenience index, not the
          # release authenticity mechanism.
          command -v cosign >/dev/null
          case "$GITHUB_WORKFLOW_REF" in
            "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" | \
            "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/flowersec-go/v${VERSION}") ;;
            *)
              echo "release signing requires the reviewed main or release-tag workflow" >&2
              exit 1
              ;;
          esac
          certificate_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          release_assets=(dist/*.tgz dist/*.tar.gz dist/checksums.txt)
          ((${#release_assets[@]} > 0))
          for asset in "${release_assets[@]}"; do
            cosign sign-blob --yes \
              --new-bundle-format=false \
              --use-signing-config=false \
              --output-signature "${asset}.sig" \
              --output-certificate "${asset}.pem" \
              "$asset"
          done
          for asset in "${release_assets[@]}"; do
            cosign verify-blob \
              --new-bundle-format=false \
              --signature "${asset}.sig" \
              --certificate "${asset}.pem" \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$asset" >/dev/null
          done

      - name: Generate release notes
        if: needs.prepare.outputs.release_complete == 'false'
        env:
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          go -C tools/releasenotes run . \
            --repo ../.. \
            --current-tag "$RELEASE_TAG" \
            --current-ref "$RELEASE_SHA" \
            --output ../../release-notes.md

      - name: Publish GitHub Release
        if: needs.prepare.outputs.release_complete == 'false'
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: |
            dist/*
          body_path: release-notes.md
          tag_name: ${{ steps.vars.outputs.tag }}
          overwrite_files: true

      - name: Verify GitHub Release asset readback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          TAG="flowersec-go/v${VERSION}"
          readback_dir="$(mktemp -d)"
          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          cleanup() {
            rm -rf "$readback_dir"
            unlink "$expected_file" "$actual_file" 2>/dev/null || true
          }
          trap cleanup EXIT

          set +e
          timeout --kill-after=5s 120s gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --dir "$readback_dir"
          download_status=$?
          set -e
          if [[ $download_status -eq 124 || $download_status -eq 137 ]]; then
            echo "GitHub Release full asset readback timed out after 120s (killed after 5s grace): $TAG" >&2
            exit 124
          fi
          if [[ $download_status -ne 0 ]]; then
            echo "GitHub Release full asset readback failed with exit $download_status: $TAG" >&2
            exit "$download_status"
          fi

          archives=(
            "floegence-flowersec-core-${VERSION}.tgz"
            "floegence-flowersec-node-native-${VERSION}.tgz"
            "floegence-flowersec-node-native-darwin-arm64-${VERSION}.tgz"
            "floegence-flowersec-node-native-darwin-x64-${VERSION}.tgz"
            "floegence-flowersec-node-native-linux-arm64-gnu-${VERSION}.tgz"
            "floegence-flowersec-node-native-linux-x64-gnu-${VERSION}.tgz"
            "flowersec-runtime_${VERSION}_linux_amd64.tar.gz"
            "flowersec-runtime_${VERSION}_linux_arm64.tar.gz"
          )
          expected=(checksums.txt checksums.txt.sig checksums.txt.pem)
          for archive in "${archives[@]}"; do
            expected+=("$archive" "$archive.sig" "$archive.pem")
          done
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort >"$expected_file"
          find "$readback_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort >"$actual_file"
          cmp -s "$expected_file" "$actual_file" || {
            echo "GitHub Release full asset readback closure mismatch" >&2
            diff -u "$expected_file" "$actual_file" >&2 || true
            exit 1
          }
          while IFS= read -r asset; do
            test -s "$readback_dir/$asset" || {
              echo "GitHub Release full asset readback is empty: $asset" >&2
              exit 1
            }
          done <"$actual_file"

          printf '%s\n' "${archives[@]}" | LC_ALL=C sort >"$expected_file"
          awk 'NF == 2 { print $2 }' "$readback_dir/checksums.txt" | LC_ALL=C sort >"$actual_file"
          cmp -s "$expected_file" "$actual_file" || {
            echo "GitHub Release checksums.txt asset closure mismatch" >&2
            exit 1
          }
          ( cd "$readback_dir" && sha256sum --check checksums.txt )

          command -v cosign >/dev/null
          identities=(
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          )
          for asset in checksums.txt "${archives[@]}"; do
            verified=false
            for identity in "${identities[@]}"; do
              if cosign verify-blob \
                --new-bundle-format=false \
                --signature "$readback_dir/${asset}.sig" \
                --certificate "$readback_dir/${asset}.pem" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$readback_dir/$asset" >/dev/null 2>&1; then
                verified=true
                break
              fi
            done
            [[ "$verified" == true ]] || {
              echo "GitHub Release asset signature does not match a trusted workflow identity: $asset" >&2
              exit 1
            }
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable GHCR version tag
        id: runtime-state
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/flowersec-runtime
          IMAGE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:$IMAGE_VERSION"
          error_file="$(mktemp)"
          set +e
          output="$(timeout --kill-after=5s 30s docker buildx imagetools inspect "$image" 2>"$error_file")"
          status=$?
          set -e
          error_text="$(cat "$error_file")"
          unlink "$error_file"
          if [[ $status -eq 124 || $status -eq 137 ]]; then
            echo "GHCR version-tag inspection timed out after 30s (killed after 5s grace): $image" >&2
            exit 124
          fi
          if [[ $status -eq 0 ]]; then
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "GHCR version tag has no valid manifest digest: $image" >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eiq 'manifest unknown|not found' <<<"$error_text"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -E 's/(token|authorization)[^ ]*/\1=<redacted>/Ig' <<<"$error_text" >&2
          echo "GHCR version-tag inspection failed with exit $status: $image" >&2
          exit "$status"

      - name: Build and push runtime image by digest
        id: runtime-image
        if: steps.runtime-state.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/flowersec-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/flowersec-runtime,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=v${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.sha }}
            DATE=${{ steps.vars.outputs.date }}

      - name: Sign new GHCR runtime digest
        if: steps.runtime-state.outputs.exists == 'false'
        env:
          IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/flowersec-runtime
          IMAGE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "runtime build returned an invalid digest: ${IMAGE_DIGEST:-<missing>}" >&2
            exit 1
          }
          case "$GITHUB_WORKFLOW_REF" in
            "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" | \
            "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/flowersec-go/v${IMAGE_VERSION}") ;;
            *)
              echo "GHCR signing requires the exact main or release-version-tag workflow identity" >&2
              exit 1
              ;;
          esac
          set +e
          timeout --kill-after=5s 120s cosign sign --yes \
            --use-signing-config=false \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          status=$?
          set -e
          if [[ $status -eq 124 || $status -eq 137 ]]; then
            echo "GHCR keyless signing timed out after 120s (killed after 5s grace): $IMAGE_REPOSITORY@$IMAGE_DIGEST" >&2
            exit 124
          fi
          if [[ $status -ne 0 ]]; then
            echo "GHCR keyless signing failed with exit $status: $IMAGE_REPOSITORY@$IMAGE_DIGEST" >&2
            exit "$status"
          fi

      - name: Verify GHCR runtime digest
        env:
          IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest || steps.runtime-state.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/flowersec-runtime
          IMAGE_VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "GHCR runtime verification requires a valid digest: ${IMAGE_DIGEST:-<missing>}" >&2
            exit 1
          }
          digest_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          verify_digest_manifest() {
            local max_attempts=6
            local inspect_timeout_seconds=30
            local attempt output observed status detail timeout_marker
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              timeout_marker="$(mktemp)"
              set +e
              output="$(TIMEOUT_MARKER="$timeout_marker" timeout --preserve-status --signal=USR1 --kill-after=5s "${inspect_timeout_seconds}s" bash -c 'trap "printf timeout > \"$TIMEOUT_MARKER\"; exit 75" USR1; docker buildx imagetools inspect "$1" 2>&1' -- "$digest_ref" 2>&1)"
              status=$?
              set -e
              if [[ -s "$timeout_marker" ]]; then
                detail="inspect timed out after ${inspect_timeout_seconds}s (killed after 5s grace)"
              elif [[ "$status" -eq 0 ]]; then
                observed="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")"
                if [[ "$observed" == "$IMAGE_DIGEST" ]]; then
                  unlink "$timeout_marker"
                  echo "GHCR digest manifest readback passed for $digest_ref"
                  return 0
                fi
                detail="digest ${observed:-<missing>}"
              else
                detail="inspect exit $status: $(tail -n 1 <<<"$output")"
              fi
              unlink "$timeout_marker"
              echo "GHCR digest manifest readback attempt $attempt/$max_attempts failed for $digest_ref: expected $IMAGE_DIGEST, got $detail" >&2
              if (( attempt < max_attempts )); then
                sleep $((attempt * 5))
              fi
            done
            echo "GHCR digest manifest readback failed after $max_attempts attempts for $digest_ref" >&2
            return 1
          }
          verify_digest_manifest

          verify_signature() {
            local identity status output
            local identities=(
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/flowersec-go/v${IMAGE_VERSION}"
            )
            for identity in "${identities[@]}"; do
              set +e
              output="$(timeout --kill-after=5s 60s cosign verify \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$digest_ref" 2>&1)"
              status=$?
              set -e
              if [[ $status -eq 0 ]]; then
                echo "GHCR signature verification passed for $digest_ref with $identity"
                return 0
              fi
              if [[ $status -eq 124 || $status -eq 137 ]]; then
                echo "GHCR signature verification timed out after 60s (killed after 5s grace): $digest_ref ($identity)" >&2
                exit 124
              fi
            done
            echo "GHCR signature does not match the exact main or release-version-tag workflow identity: $digest_ref" >&2
            tail -n 1 <<<"$output" >&2
            return 1
          }
          verify_signature

          provenance_file="$(mktemp)"
          timeout_marker="$(mktemp)"
          set +e
          TIMEOUT_MARKER="$timeout_marker" timeout --preserve-status --signal=USR1 --kill-after=5s 30s \
            bash -c 'trap "printf timeout > \"$TIMEOUT_MARKER\"; exit 75" USR1; docker buildx imagetools inspect --format "{{json .Provenance}}" "$1"' \
            -- "$digest_ref" >"$provenance_file" 2>&1
          provenance_status=$?
          set -e
          if [[ -s "$timeout_marker" ]]; then
            rm -f -- "$timeout_marker" "$provenance_file"
            echo "GHCR provenance readback timed out after 30s (killed after 5s grace): $digest_ref" >&2
            exit 124
          fi
          unlink "$timeout_marker"
          if [[ $provenance_status -ne 0 ]]; then
            tail -n 1 "$provenance_file" >&2
            unlink "$provenance_file"
            echo "GHCR provenance readback failed with exit $provenance_status: $digest_ref" >&2
            exit "$provenance_status"
          fi
          jq -e --arg version "v$IMAGE_VERSION" --arg sha "$RELEASE_SHA" '
            keys == ["linux/amd64", "linux/arm64"] and
            all(.[];
              .SLSA.buildDefinition.buildType == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md" and
              .SLSA.buildDefinition.externalParameters.request.args["build-arg:COMMIT"] == $sha and
              .SLSA.buildDefinition.externalParameters.request.args["build-arg:VERSION"] == $version and
              .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:revision"] == $sha and
              .SLSA.buildDefinition.externalParameters.request.root.request.args["vcs:source"] == "https://github.com/floegence/flowersec"
            )
          ' "$provenance_file" >/dev/null
          unlink "$provenance_file"
          echo "GHCR provenance readback passed for $digest_ref ($RELEASE_SHA)"

      - name: Publish immutable GHCR version tag
        if: steps.runtime-state.outputs.exists == 'false'
        env:
          IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/flowersec-runtime
          IMAGE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          version_ref="$IMAGE_REPOSITORY:$IMAGE_VERSION"
          error_file="$(mktemp)"
          set +e
          timeout --kill-after=5s 30s docker buildx imagetools inspect "$version_ref" >/dev/null 2>"$error_file"
          inspect_status=$?
          set -e
          if [[ $inspect_status -eq 0 ]]; then
            unlink "$error_file"
            echo "refusing to overwrite existing immutable GHCR version tag: $version_ref" >&2
            exit 1
          fi
          if [[ $inspect_status -eq 124 || $inspect_status -eq 137 ]]; then
            unlink "$error_file"
            echo "GHCR immutable-tag prepublication inspection timed out after 30s (killed after 5s grace): $version_ref" >&2
            exit 124
          fi
          if ! grep -Eiq 'manifest unknown|not found' "$error_file"; then
            sed -E 's/(token|authorization)[^ ]*/\1=<redacted>/Ig' "$error_file" >&2
            unlink "$error_file"
            echo "GHCR immutable-tag prepublication inspection failed with exit $inspect_status: $version_ref" >&2
            exit "$inspect_status"
          fi
          unlink "$error_file"
          set +e
          timeout --kill-after=5s 60s docker buildx imagetools create \
            --tag "$version_ref" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          publish_status=$?
          set -e
          if [[ $publish_status -eq 124 || $publish_status -eq 137 ]]; then
            echo "GHCR immutable version-tag publication timed out after 60s (killed after 5s grace): $version_ref" >&2
            exit 124
          fi
          if [[ $publish_status -ne 0 ]]; then
            echo "GHCR immutable version-tag publication failed with exit $publish_status: $version_ref" >&2
            exit "$publish_status"
          fi

      - name: Promote GHCR latest tag
        env:
          IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest || steps.runtime-state.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/flowersec-runtime
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=5s 60s docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:latest" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          promote_status=$?
          set -e
          if [[ $promote_status -eq 124 || $promote_status -eq 137 ]]; then
            echo "GHCR latest-tag promotion timed out after 60s (killed after 5s grace): $IMAGE_REPOSITORY:latest" >&2
            exit 124
          fi
          if [[ $promote_status -ne 0 ]]; then
            echo "GHCR latest-tag promotion failed with exit $promote_status: $IMAGE_REPOSITORY:latest" >&2
            exit "$promote_status"
          fi

      - name: Verify GHCR runtime tag readback
        env:
          IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest || steps.runtime-state.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/flowersec-runtime
          IMAGE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          verify_tag() {
            local image="$1"
            local max_attempts=6
            local attempt output observed status detail timeout_marker
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              timeout_marker="$(mktemp)"
              set +e
              output="$(TIMEOUT_MARKER="$timeout_marker" timeout --preserve-status --signal=USR1 --kill-after=5s 30s bash -c 'trap "printf timeout > \"$TIMEOUT_MARKER\"; exit 75" USR1; docker buildx imagetools inspect "$1" 2>&1' -- "$image" 2>&1)"
              status=$?
              set -e
              if [[ -s "$timeout_marker" ]]; then
                detail="inspect timed out after 30s (killed after 5s grace)"
              elif [[ $status -eq 0 ]]; then
                observed="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")"
                if [[ "$observed" == "$IMAGE_DIGEST" ]]; then
                  unlink "$timeout_marker"
                  echo "GHCR tag readback passed for $image ($observed)"
                  return 0
                fi
                detail="digest ${observed:-<missing>}"
              else
                detail="inspect exit $status: $(tail -n 1 <<<"$output")"
              fi
              unlink "$timeout_marker"
              echo "GHCR tag readback attempt $attempt/$max_attempts failed for $image: expected $IMAGE_DIGEST, got $detail" >&2
              if (( attempt < max_attempts )); then
                sleep $((attempt * 5))
              fi
            done
            echo "GHCR tag readback failed after $max_attempts attempts for $image: expected $IMAGE_DIGEST" >&2
            return 1
          }
          verify_tag "$IMAGE_REPOSITORY:$IMAGE_VERSION"
          verify_tag "$IMAGE_REPOSITORY:latest"

  npm-recovery:
    needs: [prepare, release]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.mode == 'full' && needs.release.result == 'success') ||
      (needs.prepare.outputs.mode == 'npm-only' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/flowersec-go/v${{ needs.prepare.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flowersec-go/go.mod
          cache: true
          cache-dependency-path: flowersec-go/go.sum

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Publish or recover npm registry packages from immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          SHA="$(git rev-parse HEAD)"
          git checkout "$GITHUB_SHA" -- \
            scripts/release-readback.mjs \
            scripts/verify-npm-release-package.mjs \
            scripts/verify-npm-release-consumer.mjs \
            scripts/native-addon-smoke.mjs \
            scripts/fixtures/npm-release-go-node-raw-quic/main.go
          scripts/verify-release-tags.sh "$VERSION" "$SHA"

          mkdir npm-release-assets
          set +e
          timeout --kill-after=5s 120s gh release download "flowersec-go/v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --dir npm-release-assets
          download_status=$?
          set -e
          if [[ $download_status -eq 124 || $download_status -eq 137 ]]; then
            echo "GitHub Release asset download timed out after 120s (killed after 5s grace): flowersec-go/v${VERSION}" >&2
            exit 124
          fi
          if [[ $download_status -ne 0 ]]; then
            echo "GitHub Release asset download failed with exit $download_status: flowersec-go/v${VERSION}" >&2
            exit "$download_status"
          fi

          archives=(
            "floegence-flowersec-node-native-darwin-arm64-${VERSION}.tgz"
            "floegence-flowersec-node-native-darwin-x64-${VERSION}.tgz"
            "floegence-flowersec-node-native-linux-arm64-gnu-${VERSION}.tgz"
            "floegence-flowersec-node-native-linux-x64-gnu-${VERSION}.tgz"
            "floegence-flowersec-node-native-${VERSION}.tgz"
            "floegence-flowersec-core-${VERSION}.tgz"
            "flowersec-runtime_${VERSION}_linux_amd64.tar.gz"
            "flowersec-runtime_${VERSION}_linux_arm64.tar.gz"
          )
          expected=(checksums.txt checksums.txt.sig checksums.txt.pem)
          for archive in "${archives[@]}"; do
            expected+=("$archive" "$archive.sig" "$archive.pem")
          done
          mapfile -t downloaded < <(find npm-release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${downloaded[*]}" == "${expected[*]}" ]]
          command -v cosign >/dev/null
          verify_signed() {
            local asset="$1"
            local identity
            local identities=(
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/flowersec-go/v${VERSION}"
            )
            for identity in "${identities[@]}"; do
              if cosign verify-blob \
                --new-bundle-format=false \
                --signature "${asset}.sig" \
                --certificate "${asset}.pem" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$asset" >/dev/null 2>&1; then
                return 0
              fi
            done
            echo "release asset signature does not match a trusted workflow identity: $asset" >&2
            return 1
          }
          verify_signed npm-release-assets/checksums.txt
          for archive in "${archives[@]}"; do
            verify_signed "npm-release-assets/$archive"
          done
          for archive in "${archives[@]}"; do
            test -f "npm-release-assets/${archive}"
            [[ "$(awk -v file="$archive" '$2 == file { count++ } END { print count + 0 }' npm-release-assets/checksums.txt)" == 1 ]]
          done
          ( cd npm-release-assets && sha256sum --check checksums.txt --ignore-missing )

          validate_manifest() {
            local archive="$1"
            local package="$2"
            local manifest
            manifest="$(tar -xOf "$archive" package/package.json)"
            jq -e \
              --arg package "$package" \
              --arg version "$VERSION" \
              --arg sha "$SHA" \
              '.name == $package and .version == $version and .flowersecSourceCommit == $sha' \
              <<<"$manifest" >/dev/null
          }

          has_archive_member() {
            local archive="$1"
            local member="$2"
            local listing
            listing="$(tar -tzf "$archive")"
            grep -Fqx "$member" <<<"$listing"
          }

          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            package="@floegence/flowersec-node-native-${platform}"
            archive="npm-release-assets/floegence-flowersec-node-native-${platform}-${VERSION}.tgz"
            os="${platform%%-*}"
            remainder="${platform#*-}"
            cpu="${remainder%%-*}"
            main="flowersec-node-native.${platform}.node"
            validate_manifest "$archive" "$package"
            manifest="$(tar -xOf "$archive" package/package.json)"
            jq -e \
              --arg os "$os" \
              --arg cpu "$cpu" \
              --arg main "$main" \
              --argjson linux "$([[ "$os" == linux ]] && echo true || echo false)" \
              '.os == [$os] and .cpu == [$cpu] and .main == $main and
               (.files | index($main) != null) and
               (if $linux then .libc == ["glibc"] else (.libc | not) end)' \
              <<<"$manifest" >/dev/null
            has_archive_member "$archive" "package/${main}"
          done

          wrapper_archive="npm-release-assets/floegence-flowersec-node-native-${VERSION}.tgz"
          validate_manifest "$wrapper_archive" "@floegence/flowersec-node-native"
          tar -xOf "$wrapper_archive" package/package.json | jq -e \
            --arg version "$VERSION" \
            '.optionalDependencies == {
              "@floegence/flowersec-node-native-darwin-arm64": $version,
              "@floegence/flowersec-node-native-darwin-x64": $version,
              "@floegence/flowersec-node-native-linux-arm64-gnu": $version,
              "@floegence/flowersec-node-native-linux-x64-gnu": $version
            }' >/dev/null

          core_archive="npm-release-assets/floegence-flowersec-core-${VERSION}.tgz"
          validate_manifest "$core_archive" "@floegence/flowersec-core"
          tar -xOf "$core_archive" package/package.json | jq -e \
            --arg version "$VERSION" \
            '.optionalDependencies["@floegence/flowersec-node-native"] == $version' >/dev/null
          has_archive_member "$core_archive" package/dist/node/index.js
          has_archive_member "$core_archive" package/dist/browser/index.js

          publish_archive_if_missing() {
            local package="$1"
            local archive="$2"
            local local_integrity
            local metadata
            local npm_error
            local view_status
            local repository_url
            local publish_args=(--access public)
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            npm_error="$(mktemp)"
            set +e
            metadata="$(timeout --kill-after=5s 60s npm view "${package}@${VERSION}" --json 2>"$npm_error")"
            view_status=$?
            set -e
            npm_error_text="$(cat "$npm_error")"
            unlink "$npm_error"
            if [[ $view_status -eq 124 || $view_status -eq 137 ]]; then
              echo "npm view timed out after 60s (killed after 5s grace): ${package}@${VERSION}" >&2
              return 124
            fi
            if [[ $view_status -eq 0 ]]; then
              jq -e \
                --arg package "$package" \
                --arg version "$VERSION" \
                --arg integrity "$local_integrity" \
                '.name == $package and .version == $version and .dist.integrity == $integrity' \
                <<<"$metadata" >/dev/null
              echo "${package}@${VERSION} already published; skipping"
            elif jq -e '.error.code == "E404"' <<<"$metadata" >/dev/null 2>&1; then
              repository_url="$(tar -xOf "$archive" package/package.json | jq -r '.repository?.url // empty')"
              if [[ -z "$repository_url" ]]; then
                publish_args+=(--provenance=false)
              elif [[ "$repository_url" != "git+https://github.com/floegence/flowersec.git" &&
                "$repository_url" != "https://github.com/floegence/flowersec" ]]; then
                echo "unsupported package repository URL: $repository_url" >&2
                return 2
              fi
              set +e
              timeout --kill-after=5s 180s npx -y npm@11.5.1 publish "${publish_args[@]}" "./$archive"
              publish_status=$?
              set -e
              if [[ $publish_status -eq 124 || $publish_status -eq 137 ]]; then
                echo "npm publish timed out after 180s (killed after 5s grace): ${package}@${VERSION}" >&2
                return 124
              fi
              if [[ $publish_status -ne 0 ]]; then
                echo "npm publish failed with exit $publish_status: ${package}@${VERSION}" >&2
                return "$publish_status"
              fi
            else
              sed -E 's/(token|authorization)[^ ]*/\1=<redacted>/Ig' <<<"$npm_error_text" >&2
              return "$view_status"
            fi
            node scripts/verify-npm-release-package.mjs "$package" "$VERSION" "$SHA"
          }

          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            package="@floegence/flowersec-node-native-${platform}"
            archive="npm-release-assets/floegence-flowersec-node-native-${platform}-${VERSION}.tgz"
            publish_archive_if_missing "$package" "$archive"
          done
          publish_archive_if_missing \
            "@floegence/flowersec-node-native" \
            "npm-release-assets/floegence-flowersec-node-native-${VERSION}.tgz"
          publish_archive_if_missing \
            "@floegence/flowersec-core" \
            "npm-release-assets/floegence-flowersec-core-${VERSION}.tgz"

      - name: Verify npm registry consumers
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-npm-release-consumer.mjs "$RELEASE_VERSION"
