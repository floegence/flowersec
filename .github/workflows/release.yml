name: release

on:
  push:
    tags:
      - "flowersec-go/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing coordinated release version to recover"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION_INPUT"
          if [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF_NAME#flowersec-go/v}"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be canonical major.minor.patch" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  rust-publish:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  native-prebuilt:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-13
            target: x86_64-apple-darwin
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/flowersec-go/v${{ needs.prepare.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native addon
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cargo build --manifest-path flowersec-node-native/Cargo.toml --locked --release --target "$NATIVE_TARGET"
          mkdir -p "native-package/$NATIVE_PLATFORM"
          case "$NATIVE_TARGET" in
            *apple*)
              source_binary="flowersec-node-native/target/$NATIVE_TARGET/release/libflowersec_node_native.dylib"
              ;;
            *)
              source_binary="flowersec-node-native/target/$NATIVE_TARGET/release/libflowersec_node_native.so"
              ;;
          esac
          test -f "$source_binary"
          cp "$source_binary" "native-package/$NATIVE_PLATFORM/flowersec-node-native.$NATIVE_PLATFORM.node"
          cp "flowersec-node-native/npm/$NATIVE_PLATFORM/package.json" "native-package/$NATIVE_PLATFORM/package.json"

      - name: Upload native prebuilt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowersec-node-native-${{ matrix.platform }}
          path: native-package/${{ matrix.platform }}
          if-no-files-found: error

  release:
    needs: [prepare, rust-publish, native-prebuilt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/flowersec-go/v${{ needs.prepare.outputs.version }}

      - name: Compute version vars
        id: vars
        env:
          RELEASE_VERSION_INPUT: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION_INPUT"
          TAG="flowersec-go/v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: flowersec-go/go.mod
          cache: true
          cache-dependency-path: flowersec-go/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: flowersec-ts/package-lock.json

      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          set -euo pipefail
          npx -y npm@11.5.1 --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate release version facts
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: node scripts/check-release-version-consistency.mjs "$RELEASE_VERSION"

      - name: Verify all language tags point to this commit
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
        run: scripts/verify-release-tags.sh "$RELEASE_VERSION" "$RELEASE_SHA"

      - name: Download native prebuilt packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: flowersec-node-native-*
          path: native-prebuilt
          merge-multiple: false

      - name: Build release artifacts
        env:
          RELEASE_DATE: ${{ steps.vars.outputs.date }}
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          COMMIT="$RELEASE_SHA"
          DATE="$RELEASE_DATE"

          mkdir -p dist

          # Build and pack the TypeScript SDK artifact.
          ( cd flowersec-ts && \
            npm ci --audit=false && \
            npm run build \
          )

          # Pack the TypeScript npm tarball for no-clone installs (from GitHub Releases).
          # This does not publish to npm; it only produces a .tgz artifact.
          ( cd flowersec-ts && \
            npm pack --silent && \
            mv "floegence-flowersec-core-${VERSION}.tgz" "../dist/" \
          )

          # Stage all platform binaries before packing or publishing any Node package.
          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            package_dir="native-prebuilt/flowersec-node-native-${platform}"
            test -f "$package_dir/flowersec-node-native.${platform}.node"
            cp "$package_dir/flowersec-node-native.${platform}.node" "flowersec-node-native/npm/${platform}/"
          done
          ( cd flowersec-node-native && npm pack --silent --pack-destination ../dist )
          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            ( cd "flowersec-node-native/npm/${platform}" && npm pack --silent --pack-destination ../../../dist )
          done

          build_runtime() {
            local os="$1"
            local arch="$2"
            local dir="flowersec-runtime_${VERSION}_${os}_${arch}"
            rm -rf "$dir"
            mkdir -p "$dir"

            ( cd flowersec-go && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=v${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
                -o "../$dir/flowersec-runtime" ./cmd/flowersec-runtime \
            )

            cp LICENSE "$dir/"
            scripts/stage-release-compliance.sh runtime "$dir"
            tar -C "$dir" -czf "dist/${dir}.tar.gz" .
          }

          build_runtime linux amd64
          build_runtime linux arm64

          ( cd dist && sha256sum * > checksums.txt )

      - name: Generate release notes
        env:
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          go -C tools/releasenotes run . \
            --repo ../.. \
            --current-tag "$RELEASE_TAG" \
            --current-ref "$RELEASE_SHA" \
            --output ../../release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          body_path: release-notes.md
          tag_name: ${{ steps.vars.outputs.tag }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/flowersec-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowersec-runtime:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/flowersec-runtime:latest
          build-args: |
            VERSION=v${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.sha }}
            DATE=${{ steps.vars.outputs.date }}

      - name: Publish npm package
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          publish_if_missing() {
            local pkg="$1"
            local dir="$2"
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} already published; skipping"
            else
              ( cd "$dir" && npx -y npm@11.5.1 publish --access public )
            fi
            test "$(npm view "${pkg}@${VERSION}" version)" = "$VERSION"
          }

          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            publish_if_missing "@floegence/flowersec-node-native-${platform}" "flowersec-node-native/npm/${platform}"
          done
          publish_if_missing "@floegence/flowersec-node-native" "flowersec-node-native"
          publish_if_missing "@floegence/flowersec-core" "flowersec-ts"
